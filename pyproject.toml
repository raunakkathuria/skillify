[project]
name = "skillify"
version = "0.1.0"
description = "Scan AI skill folders and generate structured indexes with interactive visual graphs"
requires-python = ">=3.10"
dependencies = [
    "click",
    "pyyaml",
    "requests",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
skillify = "skillify.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# tests/ on sys.path so tests can import the conftest helpers directly.
pythonpath = ["tests"]
testpaths = ["tests"]
