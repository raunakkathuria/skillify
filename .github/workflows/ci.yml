name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install skillify
        run: pip install .

      - name: Verify CLI loads
        run: skillify --version

      - name: Run scan on sample skills
        run: skillify scan examples/sample-skills/ -o /tmp/skillify-test --no-svg

      - name: Verify outputs exist
        run: |
          test -f /tmp/skillify-test/skills-index.json
          test -f /tmp/skillify-test/graph.json
          test -f /tmp/skillify-test/graph.html
          test -f /tmp/skillify-test/SKILLS_INDEX.md
          test -f /tmp/skillify-test/SKILLIFY_REPORT.md

      - name: Test search command
        run: skillify search "database" --index /tmp/skillify-test/skills-index.json

      - name: Test --check (should be current)
        run: skillify scan examples/sample-skills/ -o /tmp/skillify-test --check --no-html --no-svg

      - name: Test --json-output
        run: skillify scan examples/sample-skills/ -o /tmp/skillify-test --json-output --no-html --no-svg
